<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Reader Portal - SNC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400,500,600,700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-blue-50 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="w-full py-6 px-8 bg-white/80 backdrop-blur-md shadow-sm border-b border-gray-100 flex justify-between items-center">
        <h1 class="text-xl font-bold text-indigo-900 tracking-tight">📚 Digital Book Portal</h1>
        <a href="admin.html" class="text-xs font-medium text-gray-500 hover:text-indigo-600 transition">Admin Login</a>
    </header>

    <!-- Main Container -->
    <main class="max-w-md w-full mx-auto p-6 my-auto">
        <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8 text-center space-y-6">
            <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">
                📖
            </div>
            <div>
                <h2 class="text-2xl font-bold text-gray-800">പുസ്തകം കണ്ടെത്താം</h2>
                <p class="text-sm text-gray-500 mt-1">സ്കാൻ ചെയ്ത കോഡ് താഴെ നൽകുക</p>
            </div>

            <!-- Form -->
            <form id="bookForm" class="space-y-4">
                <div class="relative">
                    <input type="text" id="bookCode" placeholder="ഉദാ: BOOK001" required
                        class="w-full px-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition uppercase font-semibold text-center tracking-widest">
                </div>
                <button type="submit" id="submitBtn"
                    class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-200 transition duration-200">
                    പുസ്തകം തുറക്കുക
                </button>
            </form>

            <div id="errorMsg" class="hidden text-sm text-red-500 bg-red-50 p-3 rounded-lg"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-gray-400">
        &copy; 2026 Samastha National Education Council
    </footer>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDt3iF9qoRPm-ZzQtb8okSYQScHDorFJrw",
            authDomain: "snecbooks.firebaseapp.com",
            projectId: "snecbooks",
            storageBucket: "snecbooks.firebasestorage.app",
            messagingSenderId: "179391454663",
            appId: "1:179391454663:web:3fb8870eba9bd0290e0de2",
            measurementId: "G-WVVPS7LF22"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        const form = document.getElementById('bookForm');
        const codeInput = document.getElementById('bookCode');
        const errorMsg = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = codeInput.value.trim().toUpperCase();
            
            submitBtn.disabled = true;
            submitBtn.innerText = "തെരയുന്നു...";
            errorMsg.classList.add('hidden');

            try {
                const q = query(collection(db, "books"), where("bookCode", "==", code));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    querySnapshot.forEach((doc) => {
                        const bookData = doc.data();
                        window.location.href = bookData.bookLink;
                    });
                } else {
                    errorMsg.innerText = "ഈ കോഡിൽ പുസ്തകമൊന്നും കണ്ടെത്താനായില്ല. കോഡ് പരിശോധിക്കുക.";
                    errorMsg.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.innerText = "പുസ്തകം തുറക്കുക";
                }
            } catch (error) {
                console.error("Error: ", error);
                errorMsg.innerText = "എന്തെങ്കിലും പ്രശ്നം സംഭവിച്ചു. വീണ്ടും ശ്രമിക്കുക.";
                errorMsg.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerText = "പുസ്തകം തുറക്കുക";
            }
        });
    </script>
</body>
</html>
