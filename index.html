<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Book Portal - SNC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f6f9; }
        .theme-gradient { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); }
        .pill-btn { border-radius: 50px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .pill-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(30, 60, 114, 0.15); }
        .capsule-card { border-radius: 30px; }
        .sub-card { border-radius: 20px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800">

    <main class="max-w-2xl w-full mx-auto p-4 sm:p-6 my-auto">
        
        <!-- User View -->
        <div id="userView" class="max-w-md mx-auto bg-white capsule-card shadow-xl border border-slate-100 p-8 text-center space-y-6">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">
                <i class="fa-solid fa-barcode"></i>
            </div>
            <div>
                <h2 class="text-2xl font-bold text-slate-900">Enter Book Code</h2>
            </div>

            <form id="bookForm" class="space-y-4 text-left">
                <div>
                    <input type="text" id="bookCode" placeholder="Enter book code" required autocomplete="off"
                        class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-[20px] text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#4b7bec] focus:bg-white transition font-semibold text-center tracking-wider text-sm">
                </div>
                <button type="submit" id="submitBtn"
                    class="w-full py-3.5 px-4 theme-gradient text-white font-semibold pill-btn shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-right"></i> Submit
                </button>
            </form>
        </div>

        <!-- Admin Dashboard View -->
        <div id="adminDashboardView" class="hidden bg-white capsule-card shadow-xl border border-slate-100 p-6 sm:p-8 space-y-6">
            <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-emerald-50 text-[#05c46b] rounded-full flex items-center justify-center text-xs">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <h2 class="text-xl font-bold text-slate-900">Admin Dashboard</h2>
                </div>
                <button id="logoutBtn" class="text-xs text-[#fc5c65] font-semibold hover:bg-rose-50 px-3 py-1.5 rounded-full transition flex items-center gap-1.5">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>

            <!-- Admin Nav Tabs -->
            <div class="grid grid-cols-3 gap-2 bg-slate-100 p-1.5 rounded-full text-xs font-semibold">
                <button onclick="switchTab('add')" id="tabAdd" class="py-2.5 px-3 rounded-full transition bg-white text-blue-600 shadow-sm flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-plus"></i> Add Link
                </button>
                <button onclick="switchTab('dept')" id="tabDept" class="py-2.5 px-3 rounded-full transition text-slate-600 hover:text-slate-900 flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-layer-group"></i> Dept Codes
                </button>
                <button onclick="switchTab('list')" id="tabList" class="py-2.5 px-3 rounded-full transition text-slate-600 hover:text-slate-900 flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-list-check"></i> Saved Logs
                </button>
            </div>
            
            <!-- Tab 1: Add New Book Form -->
            <div id="sectionAdd" class="space-y-4">
                <form id="addBookForm" class="space-y-4 text-left bg-slate-50 p-6 sub-card border border-slate-200">
                    <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wide mb-2"><i class="fa-solid fa-plus-circle text-blue-600"></i> Add New Book Link</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1 ml-2">BOOK NAME</label>
                            <input type="text" id="bookName" required placeholder="e.g. Arabic Grammar"
                                class="w-full px-4 py-3 bg-white border border-slate-200 rounded-[15px] focus:ring-2 focus:ring-[#4b7bec] outline-none text-sm font-medium">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1 ml-2">UNIQUE BOOK CODE</label>
                            <input type="text" id="newBookCode" required placeholder="e.g. 101"
                                class="w-full px-4 py-3 bg-white border border-slate-200 rounded-[15px] focus:ring-2 focus:ring-[#4b7bec] outline-none uppercase text-sm font-semibold tracking-wider">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1 ml-2">DRIVE / APP LINK</label>
                        <input type="url" id="bookLink" required placeholder="https://..."
                            class="w-full px-4 py-3 bg-white border border-slate-200 rounded-[15px] focus:ring-2 focus:ring-[#4b7bec] outline-none text-sm font-medium">
                    </div>
                    <button type="submit" id="saveBtn" class="w-full py-3 theme-gradient text-white font-semibold pill-btn shadow-md flex items-center justify-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Save Book
                    </button>
                </form>
            </div>

            <!-- Tab 2: Department & Code Ranges -->
            <div id="sectionDept" class="hidden space-y-4 text-left bg-slate-50 p-6 sub-card border border-slate-200">
                <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wide mb-2"><i class="fa-solid fa-layer-group text-blue-600"></i> Department Code Guide</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                    <div class="bg-white p-3 rounded-[12px] border border-slate-200 shadow-sm">
                        <span class="font-bold text-blue-900">Department 1:</span> 101 - 199
                    </div>
                    <div class="bg-white p-3 rounded-[12px] border border-slate-200 shadow-sm">
                        <span class="font-bold text-blue-900">Department 2:</span> 201 - 299
                    </div>
                    <div class="bg-white p-3 rounded-[12px] border border-slate-200 shadow-sm">
                        <span class="font-bold text-blue-900">Department 3:</span> 301 - 399
                    </div>
                    <div class="bg-white p-3 rounded-[12px] border border-slate-200 shadow-sm">
                        <span class="font-bold text-blue-900">Department 4:</span> 401 - 499
                    </div>
                </div>
            </div>

            <!-- Tab 3: Saved Logs & List Table -->
            <div id="sectionList" class="hidden space-y-3">
                <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wide"><i class="fa-solid fa-list-check text-blue-600"></i> Saved Books Logs</h3>
                <div class="overflow-x-auto max-h-64 border border-slate-200 sub-card bg-white">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-slate-100 text-slate-700 border-b border-slate-200">
                                <th class="p-3 font-semibold">Code</th>
                                <th class="p-3 font-semibold">Book Name</th>
                                <th class="p-3 font-semibold">Link</th>
                                <th class="p-3 font-semibold text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="booksTableBody" class="divide-y divide-slate-100">
                            <!-- Loaded via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>

    <!-- Custom Modal -->
    <div id="customModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white capsule-card max-w-sm w-full p-6 text-center space-y-4 shadow-2xl border border-slate-100">
            <div id="modalIcon" class="w-14 h-14 rounded-full flex items-center justify-center mx-auto text-2xl"></div>
            <h3 id="modalTitle" class="text-xl font-bold text-slate-900"></h3>
            <p id="modalDesc" class="text-sm text-slate-500"></p>
            <button onclick="closeModal()" class="w-full py-3 theme-gradient text-white font-semibold pill-btn">OK</button>
        </div>
    </div>

    <footer class="text-center py-6 text-xs text-slate-400">
        &copy; 2026 Samastha National Education Council. All rights reserved.
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDt3iF9qoRPm-ZzQtb8okSYQScHDorFJrw",
            authDomain: "snecbooks.firebaseapp.com",
            projectId: "snecbooks",
            storageBucket: "snecbooks.firebasestorage.app",
            messagingSenderId: "179391454663",
            appId: "1:179391454663:web:3fb8870eba9bd0290e0de2",
            measurementId: "G-WVVPS7LF22"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        const userView = document.getElementById('userView');
        const adminDashboardView = document.getElementById('adminDashboardView');
        const bookForm = document.getElementById('bookForm');
        const codeInput = document.getElementById('bookCode');
        const submitBtn = document.getElementById('submitBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const addBookForm = document.getElementById('addBookForm');
        const booksTableBody = document.getElementById('booksTableBody');

        const ADMIN_PASSWORD = "admin_4321";

        function checkSession() {
            if (sessionStorage.getItem("snec_admin_auth") === "true") {
                userView.classList.add('hidden');
                adminDashboardView.classList.remove('hidden');
                loadAdminBooks();
            } else {
                adminDashboardView.classList.add('hidden');
                userView.classList.remove('hidden');
            }
        }
        checkSession();

        window.switchTab = function(tabName) {
            const tabAdd = document.getElementById('tabAdd');
            const tabDept = document.getElementById('tabDept');
            const tabList = document.getElementById('tabList');

            const sectionAdd = document.getElementById('sectionAdd');
            const sectionDept = document.getElementById('sectionDept');
            const sectionList = document.getElementById('sectionList');

            tabAdd.className = "py-2.5 px-3 rounded-full transition text-slate-600 hover:text-slate-900 flex items-center justify-center gap-1.5";
            tabDept.className = "py-2.5 px-3 rounded-full transition text-slate-600 hover:text-slate-900 flex items-center justify-center gap-1.5";
            tabList.className = "py-2.5 px-3 rounded-full transition text-slate-600 hover:text-slate-900 flex items-center justify-center gap-1.5";

            sectionAdd.classList.add('hidden');
            sectionDept.classList.add('hidden');
            sectionList.classList.add('hidden');

            if (tabName === 'add') {
                tabAdd.className = "py-2.5 px-3 rounded-full transition bg-white text-blue-600 shadow-sm flex items-center justify-center gap-1.5";
                sectionAdd.classList.remove('hidden');
            } else if (tabName === 'dept') {
                tabDept.className = "py-2.5 px-3 rounded-full transition bg-white text-blue-600 shadow-sm flex items-center justify-center gap-1.5";
                sectionDept.classList.remove('hidden');
            } else if (tabName === 'list') {
                tabList.className = "py-2.5 px-3 rounded-full transition bg-white text-blue-600 shadow-sm flex items-center justify-center gap-1.5";
                sectionList.classList.remove('hidden');
                loadAdminBooks();
            }
        }

        bookForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const inputVal = codeInput.value.trim();

            if (inputVal === ADMIN_PASSWORD) {
                sessionStorage.setItem("snec_admin_auth", "true");
                checkSession();
                codeInput.value = '';
                return;
            }

            const code = inputVal.toUpperCase();
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Searching...';

            try {
                const timeout = new Promise((_, reject) => 
                    setTimeout(() => reject(new Error('Timeout')), 6000)
                );

                const q = query(collection(db, "books"), where("bookCode", "==", code));
                const fetchPromise = getDocs(q);
                const querySnapshot = await Promise.race([fetchPromise, timeout]);

                if (!querySnapshot.empty) {
                    querySnapshot.forEach((docSnap) => {
                        const bookData = docSnap.data();
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right"></i> Submit';
                        window.location.href = bookData.bookLink;
                    });
                } else {
                    showModal('error', 'Book Not Found', 'No book exists with code: ' + code);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right"></i> Submit';
                    codeInput.value = '';
                }
            } catch (error) {
                console.error("Error: ", error);
                showModal('error', 'Connection Error', 'Failed to search. Please check your internet or Firebase Rules.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right"></i> Submit';
                codeInput.value = '';
            }
        });

        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem("snec_admin_auth");
            localStorage.clear();
            adminDashboardView.classList.add('hidden');
            userView.classList.remove('hidden');
            bookForm.reset();
        });

        addBookForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('bookName').value;
            const code = document.getElementById('newBookCode').value.trim().toUpperCase();
            const link = document.getElementById('bookLink').value;
            const saveBtn = document.getElementById('saveBtn');

            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

            try {
                await addDoc(collection(db, "books"), {
                    bookName: name,
                    bookCode: code,
                    bookLink: link,
                    createdAt: new Date()
                });

                showModal('success', 'Success!', 'Book has been successfully added to the database.');
                addBookForm.reset();
                loadAdminBooks();
            } catch (err) {
                console.error(err);
                showModal('error', 'Database Error', 'Failed to save book.');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Save Book';
            }
        });

        async function loadAdminBooks() {
            booksTableBody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin"></i> Loading books...</td></tr>';
            try {
                const querySnapshot = await getDocs(collection(db, "books"));
                booksTableBody.innerHTML = '';
                if (querySnapshot.empty) {
                    booksTableBody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-400">No books found in database.</td></tr>';
                    return;
                }
                querySnapshot.forEach((docSnap) => {
                    const book = docSnap.data();
                    const docId = docSnap.id;
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50 transition border-b border-slate-100";
                    tr.innerHTML = `
                        <td class="p-3 font-bold text-slate-900">${book.bookCode}</td>
                        <td class="p-3 font-medium text-slate-700">${book.bookName}</td>
                        <td class="p-3 text-blue-600 truncate max-w-[150px]"><a href="${book.bookLink}" target="_blank" class="hover:underline">${book.bookLink}</a></td>
                        <td class="p-3 text-center">
                            <button onclick="deleteBook('${docId}')" class="w-8 h-8 bg-rose-50 text-[#fc5c65] hover:bg-rose-100 rounded-full inline-flex items-center justify-center transition" title="Delete Book">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </td>
                    `;
                    booksTableBody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
                booksTableBody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-rose-500">Failed to load books.</td></tr>';
            }
        }

        window.deleteBook = async function(docId) {
            if (confirm("Are you sure you want to delete this book?")) {
                try {
                    await deleteDoc(doc(db, "books", docId));
                    showModal('success', 'Deleted', 'Book removed successfully.');
                    loadAdminBooks();
                } catch (err) {
                    console.error(err);
                    showModal('error', 'Error', 'Failed to delete book.');
                }
            }
        }

        window.showModal = function(type, title, desc) {
            const modal = document.getElementById('customModal');
            const icon = document.getElementById('modalIcon');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;

            if (type === 'success') {
                icon.className = "w-14 h-14 bg-emerald-50 text-[#05c46b] rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner";
                icon.innerHTML = '<i class="fa-solid fa-check"></i>';
            } else {
                icon.className = "w-14 h-14 bg-rose-50 text-[#fc5c65] rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner";
                icon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            }
            modal.classList.remove('hidden');
        }

        window.closeModal = function() {
            document.getElementById('customModal').classList.add('hidden');
        }
    </script>
</body>
</html>
